name: Tests

on:
  pull_request:
  push:
    branches: [main, twy]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install the Windows development environment
        shell: pwsh
        run: ./setup.ps1 -PythonOnly
      - name: Test the foundation without PostgreSQL
        shell: pwsh
        run: ./test.ps1 -SmokeOnly

  seat-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable runner credentials only; never used outside this job.
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://seat_store:ci-test-only@127.0.0.1:5432/seat_booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Create a non-superuser test role and separate database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE ROLE seat_store LOGIN PASSWORD 'ci-test-only'")
              conn.execute("CREATE DATABASE seat_booking_test OWNER seat_store")
          PY
      - name: Run real PostgreSQL integration and concurrency tests
        working-directory: src/seat-store
        run: python -m pytest tests -q
