name: Tests

on:
  pull_request:
  push:
    branches: [main, twy]

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test launcher compatibility, tool integrity and reset scope
        run: python -m unittest discover -s tests -p "test_*launcher.py" -v
      - name: Test reset data preservation
        run: python -m unittest discover -s tests -p test_lab_reset.py -v
      - name: Test reproducible experiment inputs and lab boundaries
        run: python -m unittest discover -s tests -p test_experiments.py -v

  kubernetes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker: v24.0.9
            containerd: false
          - docker: v28.5.2
            containerd: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: docker/setup-docker-action@v5
        with:
          version: ${{ matrix.docker }}
          daemon-config: |
            {"features": {"containerd-snapshotter": ${{ matrix.containerd }}}}
      - uses: docker/setup-compose-action@v2
        with:
          version: v2.23.3
      - name: Deploy from a clean checkout and verify booking and storage
        run: python demo.py --kubernetes --verify
      - name: Verify the bounded paired-policy integration
        run: python experiments/acceptance.py --pair-only
      - name: Capture deployment diagnostics
        if: failure()
        run: |
          .local/bin/kind-v0.33.0-linux-amd64 export logs .local/k8s/ci-logs --name csc3104 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kubernetes-diagnostics-${{ matrix.docker }}
          path: |
            .local/k8s/ci-logs/
            .local/k8s/startup-logs-*/
          retention-days: 7

  foundation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install the Windows development environment
        shell: pwsh
        run: ./setup.ps1 -PythonOnly
      - name: Test the foundation without PostgreSQL
        shell: pwsh
        run: ./test.ps1 -SmokeOnly
      - name: Test the frontend experiment environment label
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p test_frontend_context.py -v
      - name: Test gateway ownership and administrator isolation
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p test_gateway_access.py -v
      - name: Test fairness interpretation
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p test_fairness.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser booking recovery and concurrent tabs
        run: node --test frontend/tests/recovery.test.cjs frontend/tests/access.test.cjs

  seat-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # Disposable runner credentials only; never used outside this job.
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://seat_store:ci-test-only@127.0.0.1:5432/seat_booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Create a non-superuser test role and separate database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
              "postgresql://postgres:ci-bootstrap-only@127.0.0.1:5432/postgres",
              autocommit=True,
          ) as conn:
              conn.execute("CREATE ROLE seat_store LOGIN PASSWORD 'ci-test-only'")
              conn.execute("CREATE DATABASE seat_booking_test OWNER seat_store")
          PY
      - name: Run real PostgreSQL integration and concurrency tests
        working-directory: src/seat-store
        run: python -m pytest tests -q
      - name: Run dispatcher and allocation recovery tests
        run: python -m pytest src/batch-dispatcher/tests src/allocation/tests -q
      - name: Run waiting-room contract tests
        run: |
          python -m pip install -r src/services/waiting-room/requirements.txt
          python -m unittest discover -s src/services/waiting-room/tests -v
      - name: Run payment recovery tests
        run: python -m pytest src/waitlist-payment/tests -q
      - name: Run five-service PostgreSQL integration tests
        run: python -m pytest tests/test_booking_integration.py -q
