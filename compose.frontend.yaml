
name: csc3104-frontend
services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    image: csc3104-frontend:local

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      FRONTEND_HOST: "0.0.0.0"
      FRONTEND_PORT: "8080"

      WAITING_ROOM_URL: "http://host.docker.internal:5001"
      ALLOCATION_URL: "http://host.docker.internal:5002"
      SEAT_STORE_URL: "http://host.docker.internal:5003"
      PAYMENT_URL: "http://host.docker.internal:5004"
      DISPATCHER_URL: "http://host.docker.internal:5005"

    restart: unless-stopped
