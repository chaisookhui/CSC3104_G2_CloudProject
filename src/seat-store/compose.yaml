name: csc3104-seat-store
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup.ps1 first}
      POSTGRES_DB: seat_booking
      SEAT_STORE_DB_PASSWORD: ${SEAT_STORE_DB_PASSWORD:?Run setup.ps1 first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-db.sh:/docker-entrypoint-initdb.d/10-seat-store.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_booking"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes:
  postgres_data:

