# Payment-only packaging. Database and seat-store are external dependencies.
# Run init explicitly: docker compose --profile migration run --rm migrate
name: csc3104-payment
x-payment: &payment
  image: ticketing-payment:local
  build:
    context: ../..
    dockerfile: src/waitlist-payment/Dockerfile
  init: true
  environment: &environment
    PAYMENT_HOST: 0.0.0.0
    PAYMENT_PORT: '5004'
    PAYMENT_DATABASE_URL: ${PAYMENT_DATABASE_URL:?Configure the payment database URL}
    SEAT_STORE_URL: ${SEAT_STORE_URL:?Use a URL reachable from inside containers}
    SEAT_CANCEL_PATH: ${SEAT_CANCEL_PATH:-/seats/cancel}
    PAYMENT_STATUS_URL: ${PAYMENT_STATUS_URL:-}
    PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:?Set a shared internal token of at least 32 characters}
    PAYMENT_REQUIRE_AUTH: 'true'
    PAYMENT_HTTP_TIMEOUT: ${PAYMENT_HTTP_TIMEOUT:-5}
    PAYMENT_WORKER_INTERVAL: ${PAYMENT_WORKER_INTERVAL:-1}
    PAYMENT_HTTP_THREADS: ${PAYMENT_HTTP_THREADS:-8}
    PAYMENT_HTTP_CONNECTION_LIMIT: ${PAYMENT_HTTP_CONNECTION_LIMIT:-100}
    PAYMENT_DB_POOL_SIZE: ${PAYMENT_DB_POOL_SIZE:-8}
    PAYMENT_DB_POOL_WAITING: ${PAYMENT_DB_POOL_WAITING:-16}
    PAYMENT_DB_POOL_TIMEOUT: ${PAYMENT_DB_POOL_TIMEOUT:-3}
    PAYMENT_RATE_LIMIT: ${PAYMENT_RATE_LIMIT:-600}
    PAYMENT_RATE_WINDOW_SECONDS: ${PAYMENT_RATE_WINDOW_SECONDS:-60}
    PAYMENT_MAX_PENDING: ${PAYMENT_MAX_PENDING:-5000}
    PAYMENT_MAX_ATTEMPTS_PER_HOLD: ${PAYMENT_MAX_ATTEMPTS_PER_HOLD:-10}
    PAYMENT_CHECKOUT_SIGNING_KEY: ${PAYMENT_CHECKOUT_SIGNING_KEY:-}
    PAYMENT_CUSTOMER_MOCK_OUTCOME: ${PAYMENT_CUSTOMER_MOCK_OUTCOME:-success}
services:
  migrate:
    <<: *payment
    profiles: [migration]
    command: [python, service.py, init-db]
  api:
    <<: *payment
    ports: ['127.0.0.1:5004:5004']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5004/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  worker:
    <<: *payment
    command: [python, service.py, worker]
    stop_grace_period: 45s
    restart: unless-stopped
