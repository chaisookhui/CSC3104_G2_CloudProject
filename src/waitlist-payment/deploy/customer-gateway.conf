# Mount an externally provisioned certificate/key; no plaintext customer listener.
limit_req_zone $binary_remote_addr zone=payment_customer:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=payment_connections:10m;
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/payment-tls/tls.crt;
    ssl_certificate_key /etc/payment-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    # Do not log URLs, Authorization headers or customer identifiers.
    access_log off;
    location /customer/ {
        limit_req zone=payment_customer burst=20 nodelay;
        limit_req_status 429;
        limit_conn payment_connections 10;
        proxy_pass http://api:5004;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }
    # Never expose internal payment/callback/metrics/operator surfaces here.
    location / { return 404; }
}
