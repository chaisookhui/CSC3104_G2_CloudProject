# Managed by the main local Kubernetes deployment. No credentials in this file.
apiVersion: "v1"
kind: "Service"
metadata:
  name: "postgres"
spec:
  clusterIP: "None"
  selector:
    app: "postgres"
  ports:
    - name: "postgres"
      port: 5432
      targetPort: "postgres"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "postgres"
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: "postgres"
  template:
    metadata:
      labels:
        app: "postgres"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: "postgres"
          image: "postgres:17"
          imagePullPolicy: "Never"
          ports:
            - name: "postgres"
              containerPort: 5432
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: "data"
              mountPath: "/var/lib/postgresql/data"
            - name: "bootstrap"
              mountPath: "/docker-entrypoint-initdb.d"
              readOnly: true
          env:
            - name: "POSTGRES_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "POSTGRES_PASSWORD"
            - name: "APP_DATABASE_PASSWORD"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "APP_DATABASE_PASSWORD"
            - name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
          startupProbe:
            exec:
              command:
                - "pg_isready"
                - "-h"
                - "127.0.0.1"
                - "-U"
                - "postgres"
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - "pg_isready"
                - "-h"
                - "127.0.0.1"
                - "-U"
                - "postgres"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: "bootstrap"
          configMap:
            name: "database-bootstrap"
            defaultMode: 365
  volumeClaimTemplates:
    - metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "redis"
spec:
  clusterIP: "None"
  selector:
    app: "redis"
  ports:
    - name: "redis"
      port: 6379
      targetPort: "redis"
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "redis"
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app: "redis"
  template:
    metadata:
      labels:
        app: "redis"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: "redis"
          image: "redis:7-alpine"
          imagePullPolicy: "Never"
          ports:
            - name: "redis"
              containerPort: 6379
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"
          volumeMounts:
            - name: "data"
              mountPath: "/data"
          args:
            - "redis-server"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "always"
          startupProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - "redis-cli"
                - "ping"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"
