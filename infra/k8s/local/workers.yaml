# Managed by the main local Kubernetes deployment. No credentials in this file.
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "seat-worker"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "seat-worker"
  template:
    metadata:
      labels:
        app: "seat-worker"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: "worker"
          image: "ticketing-seat-store:local"
          imagePullPolicy: "Never"
          envFrom:
            - configMapRef:
                name: "core-config"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
          env:
            - name: "PAYMENT_API_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "PAYMENT_API_TOKEN"
            - name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "SEAT_DATABASE_URL"
          command:
            - "python"
            - "manage.py"
            - "worker"
      volumes:
        - name: "tmp"
          emptyDir: {}
---
