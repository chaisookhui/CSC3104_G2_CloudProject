apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "frontend"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "frontend"
  template:
    metadata:
      labels:
        app: "frontend"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: "api"
          image: "csc3104-frontend:local"
          imagePullPolicy: "Never"
          envFrom:
            - configMapRef:
                name: "core-config"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
          env:
            - name: "PAYMENT_API_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "PAYMENT_API_TOKEN"
          ports:
            - name: "http"
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: "/"
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: "/"
              port: 8080
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: "/"
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          command:
            - "python"
            - "-m"
            - "waitress"
            - "--listen=0.0.0.0:8080"
            - "--call"
            - "frontend.server:create_app"
      volumes:
        - name: "tmp"
          emptyDir: {}
