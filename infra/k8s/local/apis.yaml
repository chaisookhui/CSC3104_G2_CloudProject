# Managed by the main local Kubernetes deployment. No credentials in this file.
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "seat-api"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "seat-api"
  template:
    metadata:
      labels:
        app: "seat-api"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      containers:
        - name: "api"
          image: "ticketing-seat-store:local"
          imagePullPolicy: "Never"
          envFrom:
            - configMapRef:
                name: "core-config"
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: "tmp"
              mountPath: "/tmp"
          env:
            - name: "PAYMENT_API_TOKEN"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "PAYMENT_API_TOKEN"
            - name: "DATABASE_URL"
              valueFrom:
                secretKeyRef:
                  name: "core-secrets"
                  key: "SEAT_DATABASE_URL"
          ports:
            - name: "http"
              containerPort: 5003
          readinessProbe:
            httpGet:
              path: "/health"
              port: 5003
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: "/health"
              port: 5003
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 5003
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
      volumes:
        - name: "tmp"
          emptyDir: {}
---
