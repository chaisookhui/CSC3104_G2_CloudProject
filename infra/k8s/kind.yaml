# Local, single-node teaching cluster. All public mappings stay on loopback.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# This isolated teaching cluster also supports older Docker Desktop/WSL hosts.
# Kubernetes 1.35+ otherwise refuses to start on cgroup v1. No host setting changes.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    apiVersion: kubelet.config.k8s.io/v1beta1
    failCgroupV1: false
nodes:
  - role: control-plane
    image: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
    extraPortMappings:
      - containerPort: 30080
        hostPort: 18090
        listenAddress: 127.0.0.1
        protocol: TCP
